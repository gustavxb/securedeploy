# ===================================================================
# SECBOT - Configuracoes para Testes Automatizados (Ambiente Isolado)
# ===================================================================
spring.application.name=secbot-test

### BANCO DE DADOS EM MEMORIA (H2) ISOLADO DOS BANCOS LOCAIS ###
spring.datasource.url=jdbc:h2:mem:secbot_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

### JPA / HIBERNATE PARA H2 ###
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

### JWT PARA TESTES ###
jwt.secret=chave_secreta_jwt_para_testes_automatizados_secbot_32_chars!
jwt.expiration=3600000

