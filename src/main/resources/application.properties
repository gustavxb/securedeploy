# ===================================================================
# SECBOT - Configuracoes Gerais da Aplicacao
# ===================================================================
spring.application.name=secbot

### CONEXAO COM O BANCO DE DADOS (MYSQL) ###
# As credenciais e URL sao obtidas de variaveis de ambiente
# A variavel DB_PASSWORD e estritamente obrigatoria no ambiente de desenvolvimento/producao
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/secbot_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:secbot_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

### CONFIGURACOES DO SPRING DATA JPA (HIBERNATE) ###
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}

### CONFIGURACOES DE SEGURANCA / JWT ###
# A chave secreta DEVE ser configurada via variavel de ambiente JWT_SECRET (minimo 32 caracteres)
jwt.secret=${JWT_SECRET:}
# Tempo de expiracao do token em milissegundos (padrao: 10 horas = 36000000 ms)
jwt.expiration=${JWT_EXPIRATION:36000000}
